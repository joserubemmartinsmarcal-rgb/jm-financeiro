<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1E3A6F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JM Financeiro" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Controle Financeiro JM Transportes" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>JM Transportes — Financeiro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
  <script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lib/cloud.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: #F5F7FB; overscroll-behavior-y: none; }
    body { padding-top: env(safe-area-inset-top); }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input, select, textarea { font-size: 16px !important; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    #install-banner {
      position: fixed; bottom: 90px; left: 12px; right: 12px; z-index: 100;
      background: linear-gradient(135deg, #1E3A6F, #142850);
      color: white; padding: 14px 16px; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(30,58,111,0.35);
      display: none; align-items: center; gap: 12px;
      animation: slideUp 0.4s ease-out;
    }
    #install-banner.show { display: flex; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    #install-banner button {
      background: #FF6B35; color: white; border: none;
      padding: 8px 14px; border-radius: 10px; font-weight: 700;
      font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    #install-banner .close-x { background: transparent; padding: 4px 8px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="install-banner">
    <div style="font-size: 28px;">📲</div>
    <div style="flex: 1; min-width: 0;">
      <div style="font-weight: 700; font-size: 14px;">Instalar como app</div>
      <div style="font-size: 12px; opacity: 0.8;">Acesso rápido na tela inicial</div>
    </div>
    <button id="install-btn">Instalar</button>
    <button class="close-x" id="install-close">✕</button>
  </div>

  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem('jm:install-dismissed')) {
        document.getElementById('install-banner').classList.add('show');
      }
    });
    document.getElementById('install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('install-banner').classList.remove('show');
    });
    document.getElementById('install-close').addEventListener('click', () => {
      document.getElementById('install-banner').classList.remove('show');
      localStorage.setItem('jm:install-dismissed', '1');
    });

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const {
      BarChart, Bar, PieChart, Pie, Cell,
      XAxis, YAxis, CartesianGrid, Tooltip,
      ResponsiveContainer, Legend
    } = Recharts;
    const {
      Wallet, TrendingUp, TrendingDown, FileText, Receipt,
      AlertTriangle, BarChart3, Plus, Trash2, X, Truck,
      CheckCircle2, AlertCircle, ArrowUpCircle, ArrowDownCircle,
      CreditCard, PiggyBank, Calendar, Search,
      User, LogIn, LogOut, Settings, Crown, Lock, Download, Cloud, CloudOff
    } = LucideReact;

    const C = {
      bg: "#F5F7FB", card: "#FFFFFF", navy: "#1E3A6F", navyDark: "#142850",
      ink: "#0F172A", inkSoft: "#475569", inkMute: "#94A3B8",
      primary: "#FF6B35", green: "#10B981", red: "#EF4444",
      amber: "#F59E0B", purple: "#8B5CF6", cyan: "#06B6D4",
      pink: "#EC4899", border: "#E2E8F0", borderSoft: "#F1F5F9",
    };
    const PIE_COLORS = ["#1E3A6F","#FF6B35","#10B981","#8B5CF6","#06B6D4","#F59E0B","#EC4899"];

    const fmtBRL = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    const fmtBRLc = v => { const n=Number(v)||0; return Math.abs(n)>=1000?`R$ ${(n/1000).toFixed(1)}k`:fmtBRL(n); };
    const fmtDate = iso => { if(!iso) return "—"; const[y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
    const todayISO = () => new Date().toISOString().slice(0,10);
    const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const isVencido = d => d && d < todayISO();

    const KEYS = { lancamentos:"jm:lancamentos", boletos:"jm:boletos", notas:"jm:notas", dividas:"jm:dividas" };

    function useStored(key, initial) {
      const [data, setData] = useState(() => { try { const v=localStorage.getItem(key); return v?JSON.parse(v):initial; } catch{ return initial; } });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(data)); } catch{}
        try { window.JMCloud && window.JMCloud.push(key, data); } catch{}
      }, [data, key]);
      useEffect(() => {
        const onPull = (e) => { if (e && e.key === key) setData(e.data || []); };
        window.JMCloud && window.JMCloud.on('pull', onPull);
        return () => window.JMCloud && window.JMCloud.off('pull', onPull);
      }, [key]);
      return [data, setData];
    }

    function useCloud() {
      const [s, setS] = useState({ user: null, plan: 'free', configured: false });
      useEffect(() => {
        const update = () => setS({
          user: window.JMCloud.getUser(),
          plan: window.JMCloud.getPlan(),
          configured: window.JMCloud.isConfigured()
        });
        update();
        window.JMCloud.on('change', update);
        window.JMCloud.init();
        return () => window.JMCloud.off('change', update);
      }, []);
      return s;
    }

    function toCSV(rows, columns) {
      const header = columns.map(c => `"${c.label}"`).join(',');
      const lines = rows.map(r => columns.map(c => {
        const v = r[c.key]; const s = v == null ? '' : String(v).replace(/"/g, '""');
        return `"${s}"`;
      }).join(','));
      return [header, ...lines].join('\n');
    }
    function downloadCSV(name, rows, columns) {
      const csv = '﻿' + toCSV(rows, columns);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      a.remove(); URL.revokeObjectURL(url);
    }

    const Card = ({ children, className="", style={}, accent }) => (
      <div className={`rounded-2xl p-5 ${className}`} style={{ background:C.card, border:`1px solid ${C.border}`, boxShadow:"0 1px 3px rgba(15,23,42,0.04)", borderTop: accent?`3px solid ${accent}`:`1px solid ${C.border}`, ...style }}>{children}</div>
    );
    const Button = ({ children, onClick, variant="primary", className="", icon:Icon, type }) => {
      const s = { primary:{bg:C.navy,color:"#fff"}, accent:{bg:C.primary,color:"#fff"}, ghost:{bg:"transparent",color:C.ink,border:`1px solid ${C.border}`}, danger:{bg:C.red,color:"#fff"}, success:{bg:C.green,color:"#fff"} }[variant];
      return <button type={type||'button'} onClick={onClick} className={`px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 active:scale-95 transition-all ${className}`} style={{background:s.bg,color:s.color,border:s.border||"none"}}>{Icon&&<Icon size={16}/>}{children}</button>;
    };
    const Inp = ({ label, ...p }) => (
      <label className="flex flex-col gap-1.5 text-sm">
        {label && <span className="font-semibold text-xs uppercase tracking-wide" style={{color:C.inkSoft}}>{label}</span>}
        <input {...p} className="px-3.5 py-2.5 rounded-lg text-sm outline-none" style={{background:C.borderSoft,border:"1.5px solid transparent",color:C.ink}} onFocus={e=>{e.target.style.borderColor=C.navy;e.target.style.background="#fff"}} onBlur={e=>{e.target.style.borderColor="transparent";e.target.style.background=C.borderSoft}} />
      </label>
    );
    const Sel = ({ label, children, ...p }) => (
      <label className="flex flex-col gap-1.5 text-sm">
        {label && <span className="font-semibold text-xs uppercase tracking-wide" style={{color:C.inkSoft}}>{label}</span>}
        <select {...p} className="px-3.5 py-2.5 rounded-lg text-sm outline-none cursor-pointer" style={{background:C.borderSoft,border:"1.5px solid transparent",color:C.ink}} onFocus={e=>{e.target.style.borderColor=C.navy}} onBlur={e=>{e.target.style.borderColor="transparent"}}>{children}</select>
      </label>
    );
    const Badge = ({ children, color }) => <span className="px-2.5 py-1 rounded-md text-xs font-bold" style={{background:`${color}18`,color}}>{children}</span>;
    const Modal = ({ open, onClose, title, children }) => {
      if(!open) return null;
      return <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{background:"rgba(15,23,42,0.5)",backdropFilter:"blur(4px)"}} onClick={onClose}>
        <div className="w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto" style={{background:C.card}} onClick={e=>e.stopPropagation()}>
          <div className="sticky top-0 px-5 py-4 flex items-center justify-between" style={{background:C.card,borderBottom:`1px solid ${C.border}`}}>
            <h3 className="font-bold text-lg" style={{color:C.ink}}>{title}</h3>
            <button onClick={onClose} className="p-1.5 rounded-lg" style={{background:C.borderSoft}}><X size={18} style={{color:C.inkSoft}}/></button>
          </div>
          <div className="p-5">{children}</div>
        </div>
      </div>;
    };
    const Empty = ({ icon:Icon, title, hint }) => (
      <div className="flex flex-col items-center justify-center py-10 text-center">
        <div className="p-4 rounded-2xl mb-3" style={{background:C.borderSoft}}><Icon size={32} style={{color:C.inkMute}}/></div>
        <p className="font-bold text-base" style={{color:C.ink}}>{title}</p>
        <p className="text-sm mt-1" style={{color:C.inkSoft}}>{hint}</p>
      </div>
    );

    function ProGate({ plan, children, label, onUpgrade }) {
      if (plan === 'pro') return children;
      return (
        <button onClick={onUpgrade} className="px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5" style={{background:`${C.amber}15`,color:C.amber,border:`1px dashed ${C.amber}`}}>
          <Lock size={12}/> {label || 'PRO'}
        </button>
      );
    }

    const CATS_REC = ["Frete - Carga Fechada","Frete - Carga Fracionada","Frete - Mudanças","Locação de Veículo","Outros Serviços","Receita Financeira"];
    const CATS_DESP = ["Combustível","Pedágio","Manutenção","Pneus","Salários Motoristas","Encargos Sociais","Seguro Veículos","IPVA / Licenciamento","Aluguel Garagem","Energia / Água","Telefone / Internet","Marketing","Contabilidade","Impostos","Outras Despesas"];

    function KpiMini({ label, value, icon:Icon, color, isCount }) {
      return <Card accent={color} className="!p-4">
        <div className="p-2 rounded-lg mb-2 w-fit" style={{background:`${color}15`}}><Icon size={16} color={color}/></div>
        <p className="text-[10px] font-bold uppercase tracking-wider mb-0.5" style={{color:C.inkMute}}>{label}</p>
        <p className="font-bold text-lg" style={{color:C.ink}}>{isCount?value:fmtBRLc(value)}</p>
      </Card>;
    }

    function Dashboard({ lancamentos, boletos, notas, dividas }) {
      const stats = useMemo(() => {
        const mes = todayISO().slice(0,7);
        const recMes = lancamentos.filter(l=>l.tipo==="Receita"&&l.data?.startsWith(mes)).reduce((s,l)=>s+Number(l.valor),0);
        const despMes = lancamentos.filter(l=>l.tipo==="Despesa"&&l.data?.startsWith(mes)).reduce((s,l)=>s+Number(l.valor),0);
        const aReceber = notas.filter(n=>n.status!=="Recebido").reduce((s,n)=>s+Number(n.valor),0);
        const aPagar = boletos.filter(b=>b.status!=="Pago").reduce((s,b)=>s+Number(b.valor),0);
        const dividaTotal = dividas.filter(d=>d.status==="Ativo").reduce((s,d)=>s+Number(d.saldo),0);
        const vencidos = boletos.filter(b=>b.status!=="Pago"&&isVencido(b.vencimento)).length + notas.filter(n=>n.status!=="Recebido"&&isVencido(n.vencimento)).length;
        return { recMes, despMes, resultado:recMes-despMes, aReceber, aPagar, dividaTotal, vencidos };
      },[lancamentos,boletos,notas,dividas]);

      const chartData = useMemo(() => {
        const now = new Date();
        return Array.from({length:6},(_,i)=>{ const d=new Date(now.getFullYear(),now.getMonth()-5+i,1); const key=d.toISOString().slice(0,7); const label=d.toLocaleDateString("pt-BR",{month:"short"}); const rec=lancamentos.filter(l=>l.tipo==="Receita"&&l.data?.startsWith(key)).reduce((s,l)=>s+Number(l.valor),0); const desp=lancamentos.filter(l=>l.tipo==="Despesa"&&l.data?.startsWith(key)).reduce((s,l)=>s+Number(l.valor),0); return {mes:label,Receitas:rec,Despesas:desp}; });
      },[lancamentos]);

      const pieData = useMemo(() => {
        const mes=todayISO().slice(0,7), m={};
        lancamentos.filter(l=>l.tipo==="Despesa"&&l.data?.startsWith(mes)).forEach(l=>{ m[l.categoria]=(m[l.categoria]||0)+Number(l.valor); });
        return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value).slice(0,6);
      },[lancamentos]);

      return <div className="space-y-4">
        <Card style={{background:`linear-gradient(135deg,${C.navy} 0%,${C.navyDark} 100%)`,border:"none"}}>
          <div className="flex items-start justify-between mb-4">
            <div>
              <p className="text-xs font-semibold uppercase tracking-wider" style={{color:"#B8C5DB"}}>Resultado do mês</p>
              <p className="text-3xl font-bold text-white mt-1">{fmtBRL(stats.resultado)}</p>
            </div>
            <div className="p-2.5 rounded-xl" style={{background:stats.resultado>=0?`${C.green}30`:`${C.red}30`}}>
              {stats.resultado>=0?<TrendingUp size={22} color={C.green}/>:<TrendingDown size={22} color={C.red}/>}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            {[{label:"Receitas",val:stats.recMes,icon:ArrowUpCircle,color:C.green},{label:"Despesas",val:stats.despMes,icon:ArrowDownCircle,color:C.red}].map(({label,val,icon:Icon,color})=>
              <div key={label} className="p-3 rounded-xl" style={{background:"rgba(255,255,255,0.1)"}}>
                <div className="flex items-center gap-1.5 mb-1"><Icon size={14} color={color}/><span className="text-[10px] font-bold uppercase tracking-wider" style={{color:"#B8C5DB"}}>{label}</span></div>
                <p className="text-white font-bold text-lg">{fmtBRLc(val)}</p>
              </div>
            )}
          </div>
        </Card>
        <div className="grid grid-cols-2 gap-3">
          <KpiMini label="A Receber" value={stats.aReceber} icon={FileText} color={C.green}/>
          <KpiMini label="A Pagar" value={stats.aPagar} icon={Receipt} color={C.amber}/>
          <KpiMini label="Dívida Ativa" value={stats.dividaTotal} icon={AlertTriangle} color={C.red}/>
          <KpiMini label="Vencidos" value={stats.vencidos} icon={AlertCircle} color={C.purple} isCount/>
        </div>
        <Card accent={C.primary}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-bold text-base" style={{color:C.ink}}>Receitas × Despesas</h3>
            <span className="text-xs font-semibold" style={{color:C.inkMute}}>Últimos 6 meses</span>
          </div>
          {chartData.every(d=>d.Receitas===0&&d.Despesas===0)?<Empty icon={BarChart3} title="Sem dados" hint="Adicione lançamentos"/>:
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={chartData} margin={{top:5,right:5,left:-20,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false}/>
              <XAxis dataKey="mes" tick={{fontSize:11,fill:C.inkSoft}} axisLine={false} tickLine={false}/>
              <YAxis tick={{fontSize:10,fill:C.inkMute}} axisLine={false} tickLine={false} tickFormatter={v=>v>=1000?`${(v/1000).toFixed(0)}k`:v}/>
              <Tooltip contentStyle={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,fontSize:12}} formatter={v=>fmtBRL(v)}/>
              <Legend wrapperStyle={{fontSize:12}}/>
              <Bar dataKey="Receitas" fill={C.green} radius={[6,6,0,0]}/>
              <Bar dataKey="Despesas" fill={C.red} radius={[6,6,0,0]}/>
            </BarChart>
          </ResponsiveContainer>}
        </Card>
        <Card accent={C.purple}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-bold text-base" style={{color:C.ink}}>Despesas por Categoria</h3>
            <span className="text-xs font-semibold" style={{color:C.inkMute}}>Mês atual</span>
          </div>
          {pieData.length===0?<Empty icon={PiggyBank} title="Sem despesas" hint="Cadastre saídas"/>:
          <div className="flex flex-col sm:flex-row items-center gap-4">
            <ResponsiveContainer width="100%" height={180}>
              <PieChart>
                <Pie data={pieData} dataKey="value" cx="50%" cy="50%" innerRadius={40} outerRadius={70} paddingAngle={3}>
                  {pieData.map((_,i)=><Cell key={i} fill={PIE_COLORS[i%PIE_COLORS.length]}/>)}
                </Pie>
                <Tooltip contentStyle={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,fontSize:12}} formatter={v=>fmtBRL(v)}/>
              </PieChart>
            </ResponsiveContainer>
            <div className="flex-1 w-full space-y-1.5">
              {pieData.map((item,i)=>(
                <div key={i} className="flex items-center justify-between text-sm">
                  <div className="flex items-center gap-2 min-w-0">
                    <div className="w-3 h-3 rounded-sm flex-shrink-0" style={{background:PIE_COLORS[i%PIE_COLORS.length]}}/>
                    <span className="truncate font-medium" style={{color:C.ink}}>{item.name}</span>
                  </div>
                  <span className="font-bold text-xs ml-2" style={{color:C.inkSoft}}>{fmtBRLc(item.value)}</span>
                </div>
              ))}
            </div>
          </div>}
        </Card>
      </div>;
    }

    const LANC_COLS = [
      { key:'data', label:'Data' }, { key:'descricao', label:'Descrição' },
      { key:'categoria', label:'Categoria' }, { key:'tipo', label:'Tipo' }, { key:'valor', label:'Valor' }
    ];
    const BOL_COLS = [
      { key:'fornecedor', label:'Fornecedor' }, { key:'categoria', label:'Categoria' },
      { key:'valor', label:'Valor' }, { key:'vencimento', label:'Vencimento' }, { key:'status', label:'Status' }
    ];
    const NOTA_COLS = [
      { key:'cliente', label:'Cliente' }, { key:'numNota', label:'Nº Nota' },
      { key:'valor', label:'Valor' }, { key:'vencimento', label:'Vencimento' }, { key:'status', label:'Status' }
    ];
    const DIV_COLS = [
      { key:'credor', label:'Credor' }, { key:'tipo', label:'Tipo' },
      { key:'saldo', label:'Saldo' }, { key:'valorParcela', label:'Parcela' },
      { key:'parcelaPaga', label:'Pagas' }, { key:'parcelaTotal', label:'Total' }, { key:'status', label:'Status' }
    ];

    function Lancamentos({ data, setData, plan, onUpgrade }) {
      const [open,setOpen]=useState(false);
      const [search,setSearch]=useState("");
      const [form,setForm]=useState({data:todayISO(),descricao:"",categoria:"",tipo:"Receita",valor:""});
      const handleAdd=()=>{ if(!form.descricao||!form.valor||!form.categoria)return; setData([{id:uid(),...form,valor:Number(form.valor)},...data]); setForm({data:todayISO(),descricao:"",categoria:"",tipo:"Receita",valor:""}); setOpen(false); };
      const filtered=data.filter(l=>l.descricao?.toLowerCase().includes(search.toLowerCase())||l.categoria?.toLowerCase().includes(search.toLowerCase()));
      const totalRec=data.filter(l=>l.tipo==="Receita").reduce((s,l)=>s+Number(l.valor),0);
      const totalDesp=data.filter(l=>l.tipo==="Despesa").reduce((s,l)=>s+Number(l.valor),0);
      return <div className="space-y-4">
        <div className="flex items-center justify-between">
          <div><h2 className="font-bold text-2xl" style={{color:C.ink}}>Lançamentos</h2><p className="text-sm" style={{color:C.inkSoft}}>{data.length} registros</p></div>
          <div className="flex items-center gap-2">
            {plan==='pro'
              ? <button onClick={()=>downloadCSV('lancamentos.csv', data, LANC_COLS)} className="px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5" style={{background:C.borderSoft,color:C.ink}}><Download size={14}/>CSV</button>
              : <ProGate plan={plan} onUpgrade={onUpgrade} label="CSV PRO"/>}
            <Button onClick={()=>setOpen(true)} variant="accent" icon={Plus}>Novo</Button>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Card accent={C.green} className="!p-4"><p className="text-[10px] font-bold uppercase tracking-wider" style={{color:C.inkMute}}>Receitas</p><p className="font-bold text-xl mt-1" style={{color:C.green}}>{fmtBRLc(totalRec)}</p></Card>

    function Account({ cloud, onUpgrade }) {
      const [view, setView] = useState(cloud.user ? 'profile' : (cloud.configured ? 'login' : 'config'));
      useEffect(() => {
        if (cloud.user) setView('profile');
        else if (!cloud.configured) setView('config');
        else if (view === 'profile') setView('login');
      }, [cloud.user, cloud.configured]);

      if (view === 'config') return <Config onSaved={() => setView(cloud.user ? 'profile' : 'login')} />;
      if (view === 'profile' && cloud.user) return <Profile cloud={cloud} onUpgrade={onUpgrade} onConfig={() => setView('config')} />;
      return <AuthForm mode={view} setMode={setView} onConfig={() => setView('config')} configured={cloud.configured} />;
    }

    function AuthForm({ mode, setMode, onConfig, configured }) {
      const [email, setEmail] = useState('');
      const [pwd, setPwd] = useState('');
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');
      const submit = async () => {
        setBusy(true); setMsg('');
        try {
          if (mode === 'signup') {
            await window.JMCloud.signUp(email, pwd);
            setMsg('Cadastro feito! Confirme via email e faça login.');
            setMode('login');
          } else {
            await window.JMCloud.signIn(email, pwd);
          }
        } catch (e) { setMsg(e.message || 'Erro'); } finally { setBusy(false); }
      };
      return <div className="space-y-4">
        <div className="text-center">
          <div className="inline-flex p-4 rounded-2xl mb-3" style={{background:`${C.navy}10`}}><User size={36} color={C.navy}/></div>
          <h2 className="font-bold text-2xl" style={{color:C.ink}}>{mode === 'signup' ? 'Criar conta' : 'Entrar'}</h2>
          <p className="text-sm mt-1" style={{color:C.inkSoft}}>Sincronize seus dados em todos os dispositivos</p>
        </div>
        {!configured && <Card accent={C.amber}>
          <p className="text-sm" style={{color:C.ink}}><strong>Supabase não configurado.</strong> Vá em Configurações para colar URL + chave.</p>
          <Button onClick={onConfig} variant="ghost" className="mt-3 w-full" icon={Settings}>Configurar</Button>
        </Card>}
        <Card>
          <div className="space-y-3">
            <Inp label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" autoComplete="email"/>
            <Inp label="Senha" type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" autoComplete={mode==='signup'?'new-password':'current-password'}/>
            {msg && <p className="text-xs font-semibold" style={{color: msg.includes('!')?C.green:C.red}}>{msg}</p>}
            <Button onClick={submit} variant="primary" className="w-full" icon={mode==='signup'?Plus:LogIn}>{busy ? '...' : (mode === 'signup' ? 'Cadastrar' : 'Entrar')}</Button>
            <button onClick={()=>setMode(mode === 'signup' ? 'login' : 'signup')} className="w-full text-xs font-semibold py-2" style={{color:C.navy}}>
              {mode === 'signup' ? 'Já tenho conta — entrar' : 'Criar nova conta'}
            </button>
          </div>
        </Card>
        <button onClick={onConfig} className="w-full text-xs font-semibold py-2 flex items-center justify-center gap-1.5" style={{color:C.inkMute}}>
          <Settings size={12}/> Configurações
        </button>
      </div>;
    }

    function Profile({ cloud, onUpgrade, onConfig }) {
      const isPro = cloud.plan === 'pro';
      const handleLogout = async () => { await window.JMCloud.signOut(); };
      return <div className="space-y-4">
        <Card style={{background:`linear-gradient(135deg,${C.navy} 0%,${C.navyDark} 100%)`,border:"none"}}>
          <div className="flex items-center gap-3">
            <div className="p-3 rounded-xl" style={{background:"rgba(255,255,255,0.15)"}}><User size={28} color="#fff"/></div>
            <div className="flex-1 min-w-0">
              <p className="text-xs font-semibold uppercase tracking-wider" style={{color:"#B8C5DB"}}>Conectado como</p>
              <p className="font-bold text-white text-base truncate">{cloud.user?.email || '—'}</p>
            </div>
            <div className="flex items-center gap-1.5 px-2 py-1 rounded-md" style={{background:isPro?`${C.amber}30`:"rgba(255,255,255,0.15)"}}>
              {isPro ? <Crown size={12} color={C.amber}/> : <Cloud size={12} color="#fff"/>}
              <span className="text-[10px] font-bold uppercase" style={{color:isPro?C.amber:"#fff"}}>{isPro ? 'PRO' : 'FREE'}</span>
            </div>
          </div>
        </Card>
        {!isPro && <Card accent={C.primary}>
          <div className="flex items-start gap-3 mb-3">
            <div className="p-2 rounded-xl" style={{background:`${C.primary}15`}}><Crown size={20} color={C.primary}/></div>
            <div className="flex-1">
              <h3 className="font-bold text-base" style={{color:C.ink}}>Assine o PRO</h3>
              <p className="text-xs mt-0.5" style={{color:C.inkSoft}}>Exportação CSV, relatórios avançados e mais.</p>
            </div>
          </div>
          <ul className="space-y-1.5 mb-4">
            {['Exportar CSV de Lançamentos, Boletos, Notas e Dívidas','Sincronização em todos os dispositivos','Relatórios anuais (em breve)','Importação OFX (em breve)'].map(f=>(
              <li key={f} className="flex items-start gap-2 text-xs" style={{color:C.ink}}><CheckCircle2 size={12} color={C.green} className="mt-0.5 flex-shrink-0"/>{f}</li>
            ))}
          </ul>
          <Button onClick={onUpgrade} variant="accent" className="w-full" icon={Crown}>Assinar PRO</Button>
        </Card>}
        <Card>
          <h3 className="font-bold text-sm mb-3" style={{color:C.ink}}>Sincronização</h3>
          <div className="flex items-center gap-2 text-sm" style={{color:C.inkSoft}}>
            <Cloud size={16} color={C.green}/> <span>Ativa — dados sincronizados.</span>
          </div>
        </Card>
        <div className="grid grid-cols-2 gap-3">
          <Button onClick={onConfig} variant="ghost" icon={Settings}>Config</Button>
          <Button onClick={handleLogout} variant="danger" icon={LogOut}>Sair</Button>
        </div>
      </div>;
    }

    function Config({ onSaved }) {
      const cur = window.JMCloud.getConfig();
      const [url, setUrl] = useState(cur.url);
      const [key, setKey] = useState(cur.key);
      const [checkout, setCheckout] = useState(cur.checkout);
      const save = () => {
        window.JMCloud.setConfig({ url: url.trim(), key: key.trim(), checkout: checkout.trim() });
        window.JMCloud.init().then(() => onSaved && onSaved());
      };
      return <div className="space-y-4">
        <div>
          <h2 className="font-bold text-2xl" style={{color:C.ink}}>Configurações</h2>
          <p className="text-sm mt-1" style={{color:C.inkSoft}}>Cole suas chaves para ativar nuvem e cobrança.</p>
        </div>
        <Card>
          <h3 className="font-bold text-sm mb-3 flex items-center gap-2" style={{color:C.ink}}>
            <Cloud size={16} color={C.navy}/> Supabase (login + sync)
          </h3>
          <div className="space-y-3">
            <Inp label="Project URL" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxx.supabase.co"/>
            <Inp label="Anon public key" value={key} onChange={e=>setKey(e.target.value)} placeholder="eyJhbGc..." />
          </div>
        </Card>
        <Card>
          <h3 className="font-bold text-sm mb-3 flex items-center gap-2" style={{color:C.ink}}>
            <Crown size={16} color={C.amber}/> Cobrança PRO
          </h3>
          <div className="space-y-3">
            <Inp label="Checkout URL (Stripe Payment Link OU Mercado Pago)" value={checkout} onChange={e=>setCheckout(e.target.value)} placeholder="https://buy.stripe.com/... OU https://www.mercadopago.com/..."/>
          </div>
        </Card>
        <Card accent={C.cyan}>
          <p className="text-xs" style={{color:C.inkSoft}}>
            ℹ️ Veja <strong>SETUP.md</strong> no repositório para o passo-a-passo completo de criação de projeto Supabase, schema SQL, deploy da Edge Function de webhook e geração do link de pagamento.
          </p>
        </Card>
        <Button onClick={save} variant="primary" className="w-full" icon={CheckCircle2}>Salvar e conectar</Button>
      </div>;
    }

    function App() {
      const [tab,setTab]=useState("dashboard");
      const cloud = useCloud();
      const [lancamentos,setLancamentos]=useStored(KEYS.lancamentos,[]);
      const [boletos,setBoletos]=useStored(KEYS.boletos,[]);
      const [notas,setNotas]=useStored(KEYS.notas,[]);
      const [dividas,setDividas]=useStored(KEYS.dividas,[]);
      const onUpgrade = () => {
        if (!cloud.user) { setTab('conta'); return; }
        window.JMCloud.openCheckout();
      };
      const tabs=[
        {id:"dashboard",label:"Painel",icon:BarChart3},
        {id:"lancamentos",label:"Lança.",icon:Wallet},
        {id:"boletos",label:"A Pagar",icon:Receipt},
        {id:"notas",label:"A Recb.",icon:FileText},
        {id:"dividas",label:"Dívidas",icon:AlertTriangle},
        {id:"conta",label:"Conta",icon:User},
      ];
      const showSyncIcon = cloud.configured;
      return <div className="min-h-screen w-full" style={{background:C.bg,fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}}>
        <header className="sticky top-0 z-40 px-4 py-3" style={{background:`linear-gradient(135deg,${C.navy} 0%,${C.navyDark} 100%)`,boxShadow:"0 4px 16px rgba(30,58,111,0.2)"}}>
          <div className="max-w-6xl mx-auto flex items-center gap-3">
            <div className="flex items-center justify-center rounded-xl" style={{width:44,height:44,background:`linear-gradient(135deg,${C.navy} 0%,${C.navyDark} 100%)`,border:"2px solid rgba(255,255,255,0.2)"}}>
              <span className="font-bold text-white text-lg" style={{fontFamily:"Georgia,serif"}}>JM</span>
            </div>
            <div className="flex-1 min-w-0">
              <h1 className="font-bold text-white text-lg truncate" style={{fontFamily:"Georgia,serif"}}>JM Transportes</h1>
              <p className="text-xs truncate" style={{color:"#B8C5DB"}}>{cloud.user ? cloud.user.email : 'Controle Financeiro'}</p>
            </div>
            <div className="flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{background:"rgba(255,255,255,0.1)"}}>
              {showSyncIcon
                ? (cloud.user
                    ? <><Cloud size={14} color={C.green}/><span className="text-[10px] font-bold text-white hidden sm:inline">SYNC</span></>
                    : <><CloudOff size={14} color="#B8C5DB"/><span className="text-[10px] font-bold text-white hidden sm:inline">LOCAL</span></>)
                : <><Truck size={14} style={{color:"#FF6B35"}}/><span className="text-[10px] font-bold text-white hidden sm:inline">LOCAL</span></>}
              {cloud.plan === 'pro' && <Crown size={14} color={C.amber}/>}
            </div>
          </div>
        </header>
        <main className="max-w-6xl mx-auto px-4 py-5 pb-28">
          {tab==="dashboard"&&<Dashboard lancamentos={lancamentos} boletos={boletos} notas={notas} dividas={dividas}/>}
          {tab==="lancamentos"&&<Lancamentos data={lancamentos} setData={setLancamentos} plan={cloud.plan} onUpgrade={onUpgrade}/>}
          {tab==="boletos"&&<Boletos data={boletos} setData={setBoletos} plan={cloud.plan} onUpgrade={onUpgrade}/>}
          {tab==="notas"&&<Notas data={notas} setData={setNotas} plan={cloud.plan} onUpgrade={onUpgrade}/>}
          {tab==="dividas"&&<Dividas data={dividas} setData={setDividas} plan={cloud.plan} onUpgrade={onUpgrade}/>}
          {tab==="conta"&&<Account cloud={cloud} onUpgrade={onUpgrade}/>}
        </main>
        <nav className="fixed bottom-0 left-0 right-0 z-40 px-2 py-2" style={{background:C.card,borderTop:`1px solid ${C.border}`,boxShadow:"0 -4px 16px rgba(15,23,42,0.06)"}}>
          <div className="max-w-6xl mx-auto flex justify-around">
            {tabs.map(({id,label,icon:Icon})=>{ const active=tab===id; return <button key={id} onClick={()=>setTab(id)} className="flex flex-col items-center gap-1 px-1 py-2 rounded-xl flex-1 min-w-0" style={{background:active?`${C.navy}10`:"transparent"}}><Icon size={20} style={{color:active?C.navy:C.inkMute}} strokeWidth={active?2.5:2}/><span className="text-[10px] font-semibold truncate w-full text-center" style={{color:active?C.navy:C.inkMute}}>{label}</span></button>; })}
          </div>
        </nav>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
