<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1E3A6F" />
  <title>JM Transportes — Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
  <script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: #F5F7FB; overscroll-behavior-y: none; }
    body { padding-top: env(safe-area-inset-top); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const {
      BarChart, Bar, PieChart, Pie, Cell,
      XAxis, YAxis, CartesianGrid, Tooltip,
      ResponsiveContainer, Legend
    } = Recharts;
    const {
      TrendingUp, TrendingDown, Wallet, FileText,
      AlertTriangle, Calendar, ChevronRight, ArrowLeft,
      CheckCircle2
    } = LucideReact;

    const C = {
      bg: "#F5F7FB", card: "#FFFFFF", navy: "#1E3A6F", navyDark: "#142850",
      ink: "#0F172A", inkSoft: "#475569", inkMute: "#94A3B8",
      primary: "#FF6B35", green: "#10B981", red: "#EF4444",
      amber: "#F59E0B", purple: "#8B5CF6", cyan: "#06B6D4",
      border: "#E2E8F0", borderSoft: "#F1F5F9",
    };
    const PIE_COLORS = ["#1E3A6F","#FF6B35","#10B981","#8B5CF6","#06B6D4","#F59E0B","#EC4899","#64748B"];

    const fmtBRL = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    const fmtBRLc = v => { const n=Number(v)||0; return Math.abs(n)>=1000?`R$ ${(n/1000).toFixed(1)}k`:fmtBRL(n); };
    const fmtDateFull = iso => { if(!iso) return "—"; const[y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
    const todayISO = () => new Date().toISOString().slice(0,10);
    const mesAtual = () => todayISO().slice(0,7);
    const isVencido = d => d && d < todayISO();
    const diasAteVenc = d => {
      if(!d) return null;
      return Math.ceil((new Date(d+'T00:00:00') - new Date()) / 86400000);
    };

    function readLS(key) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : []; } catch { return []; }
    }

    function App() {
      const [lancamentos, setLancamentos] = useState(() => readLS("jm:lancamentos"));
      const [boletos, setBoletos]         = useState(() => readLS("jm:boletos"));
      const [notas, setNotas]             = useState(() => readLS("jm:notas"));
      const [dividas, setDividas]         = useState(() => readLS("jm:dividas"));
      const [tab, setTab]                 = useState("resumo");

      useEffect(() => {
        const sync = () => {
          setLancamentos(readLS("jm:lancamentos"));
          setBoletos(readLS("jm:boletos"));
          setNotas(readLS("jm:notas"));
          setDividas(readLS("jm:dividas"));
        };
        window.addEventListener("focus", sync);
        return () => window.removeEventListener("focus", sync);
      }, []);

      const mes = mesAtual();

      const receitasMes = useMemo(() =>
        lancamentos.filter(l => l.tipo === "Receita" && l.data && l.data.startsWith(mes))
          .reduce((s, l) => s + (Number(l.valor)||0), 0)
      , [lancamentos, mes]);

      const despesasMes = useMemo(() =>
        lancamentos.filter(l => l.tipo === "Despesa" && l.data && l.data.startsWith(mes))
          .reduce((s, l) => s + (Number(l.valor)||0), 0)
      , [lancamentos, mes]);

      const resultadoMes = receitasMes - despesasMes;

      const totalAReceber = useMemo(() =>
        notas.filter(n => n.status === "A Receber")
          .reduce((s, n) => s + (Number(n.valor)||0), 0)
      , [notas]);

      const compromissos = useMemo(() => {
        const b = boletos
          .filter(b => b.status === "A Pagar")
          .map(b => ({
            id: b.id, tipo: "Boleto", descricao: b.fornecedor,
            categoria: b.categoria, valor: Number(b.valor)||0,
            vencimento: b.vencimento, vencido: isVencido(b.vencimento)
          }));
        const d = dividas
          .filter(d => d.status === "Ativo")
          .map(d => ({
            id: d.id, tipo: "Dívida", descricao: d.credor,
            categoria: d.tipo || "Financiamento",
            valor: Number(d.valorParcela)||0,
            vencimento: d.proxVenc, vencido: isVencido(d.proxVenc)
          }));
        return [...b, ...d].sort((a,b) => (a.vencimento||"9999") < (b.vencimento||"9999") ? -1 : 1);
      }, [boletos, dividas]);

      const totalAP = compromissos.reduce((s,c) => s + c.valor, 0);
      const vencidosAP = compromissos.filter(c => c.vencido);

      const recCat = useMemo(() => {
        const map = {};
        lancamentos
          .filter(l => l.tipo === "Receita" && l.data && l.data.startsWith(mes))
          .forEach(l => { map[l.categoria] = (map[l.categoria]||0) + (Number(l.valor)||0); });
        return Object.entries(map).map(([name, value]) => ({ name, value }))
          .sort((a,b) => b.value - a.value);
      }, [lancamentos, mes]);

      const despCat = useMemo(() => {
        const map = {};
        lancamentos
          .filter(l => l.tipo === "Despesa" && l.data && l.data.startsWith(mes))
          .forEach(l => { map[l.categoria] = (map[l.categoria]||0) + (Number(l.valor)||0); });
        return Object.entries(map).map(([name, value]) => ({ name, value }))
          .sort((a,b) => b.value - a.value);
      }, [lancamentos, mes]);

      const evolucao = useMemo(() => {
        const meses = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
          const m = d.toISOString().slice(0,7);
          const label = d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
          const rec = lancamentos.filter(l => l.tipo==="Receita" && l.data && l.data.startsWith(m)).reduce((s,l) => s+(Number(l.valor)||0), 0);
          const desp = lancamentos.filter(l => l.tipo==="Despesa" && l.data && l.data.startsWith(m)).reduce((s,l) => s+(Number(l.valor)||0), 0);
          meses.push({ label, rec, desp, result: rec-desp });
        }
        return meses;
      }, [lancamentos]);

      const notasAReceber = useMemo(() =>
        notas.filter(n => n.status === "A Receber")
          .sort((a,b) => (a.vencimento||"9999") < (b.vencimento||"9999") ? -1 : 1)
      , [notas]);

      const mesLabel = new Date().toLocaleDateString("pt-BR",{month:"long", year:"numeric"});

      const semDados = !lancamentos.length && !boletos.length && !notas.length && !dividas.length;

      return (
        <div style={{background:C.bg, minHeight:"100vh"}}>
          {/* Header */}
          <div style={{background:C.navy}} className="sticky top-0 z-40">
            <div className="px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div style={{background:"rgba(255,255,255,0.15)", borderRadius:10, padding:"6px 10px"}}>
                  <span style={{color:"#fff", fontWeight:800, fontSize:15}}>JM</span>
                </div>
                <div>
                  <div style={{color:"#fff", fontWeight:700, fontSize:15}}>Dashboard Financeiro</div>
                  <div style={{color:"rgba(255,255,255,0.6)", fontSize:11}}>{mesLabel}</div>
                </div>
              </div>
              <a href="index.html" className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl"
                style={{background:"rgba(255,255,255,0.12)", color:"rgba(255,255,255,0.85)", fontSize:12, fontWeight:600, textDecoration:"none"}}>
                <ArrowLeft size={13}/> Financeiro
              </a>
            </div>
            <div className="flex px-4 pb-1 gap-1">
              {[["resumo","Resumo"],["compromissos","A Pagar"],["receitas","Receitas"],["evolucao","Evolução"]].map(([k,l]) => (
                <button key={k} onClick={() => setTab(k)}
                  className="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
                  style={{
                    background: tab===k ? "rgba(255,255,255,0.2)" : "transparent",
                    color: tab===k ? "#fff" : "rgba(255,255,255,0.5)"
                  }}>{l}</button>
              ))}
            </div>
          </div>

          <div className="px-4 py-4 max-w-2xl mx-auto" style={{paddingBottom:40}}>

            {semDados && (
              <div className="rounded-2xl p-8 text-center mt-4" style={{background:C.card, border:`1px solid ${C.border}`}}>
                <p className="font-bold" style={{color:C.ink}}>Nenhum dado ainda</p>
                <p className="text-sm mt-1" style={{color:C.inkSoft}}>Lance boletos, notas e receitas no app Financeiro para visualizar o dashboard.</p>
                <a href="index.html" className="inline-block mt-4 px-5 py-2.5 rounded-xl font-semibold text-sm"
                  style={{background:C.navy, color:"#fff", textDecoration:"none"}}>Abrir Financeiro</a>
              </div>
            )}

            {/* RESUMO */}
            {tab === "resumo" && !semDados && (
              <div className="flex flex-col gap-4">
                <div className="grid grid-cols-2 gap-3">
                  <KpiCard label="Receitas" value={receitasMes} color={C.green} icon={TrendingUp} />
                  <KpiCard label="Despesas" value={despesasMes} color={C.red} icon={TrendingDown} />
                  <KpiCard label="Resultado" value={resultadoMes} color={resultadoMes>=0?C.green:C.red} icon={Wallet} highlight />
                  <KpiCard label="A Receber" value={totalAReceber} color={C.amber} icon={FileText} />
                </div>

                {vencidosAP.length > 0 && (
                  <div className="rounded-2xl p-4 flex items-start gap-3"
                    style={{background:`${C.red}10`, border:`1.5px solid ${C.red}30`}}>
                    <AlertTriangle size={18} style={{color:C.red, flexShrink:0, marginTop:1}}/>
                    <div>
                      <p className="font-bold text-sm" style={{color:C.red}}>
                        {vencidosAP.length} compromisso{vencidosAP.length>1?"s":""} vencido{vencidosAP.length>1?"s":""}
                      </p>
                      <p className="text-xs mt-0.5" style={{color:C.red}}>{vencidosAP.map(v=>v.descricao).join(", ")}</p>
                    </div>
                  </div>
                )}

                <div className="rounded-2xl p-4 flex items-center justify-between"
                  style={{background:C.card, border:`1px solid ${C.border}`}}>
                  <div>
                    <p className="text-xs font-semibold" style={{color:C.inkSoft}}>TOTAL A PAGAR</p>
                    <p className="text-xl font-bold mt-0.5" style={{color:C.ink}}>{fmtBRL(totalAP)}</p>
                    <p className="text-xs mt-0.5" style={{color:C.inkMute}}>{compromissos.length} pendência{compromissos.length!==1?"s":""}</p>
                  </div>
                  <button onClick={()=>setTab("compromissos")} className="flex items-center gap-1 px-3 py-2 rounded-xl text-xs font-semibold"
                    style={{background:C.navy, color:"#fff"}}>
                    Ver <ChevronRight size={13}/>
                  </button>
                </div>

                {recCat.length > 0 && (
                  <div className="rounded-2xl p-4" style={{background:C.card, border:`1px solid ${C.border}`}}>
                    <p className="font-bold text-sm mb-3" style={{color:C.ink}}>Receitas por serviço</p>
                    <ResponsiveContainer width="100%" height={Math.max(140, recCat.length*32)}>
                      <BarChart data={recCat} layout="vertical" margin={{left:0,right:8,top:0,bottom:0}}>
                        <CartesianGrid strokeDasharray="3 3" stroke={C.border} horizontal={false}/>
                        <XAxis type="number" tick={{fontSize:9,fill:C.inkMute}} tickFormatter={v=>fmtBRLc(v)}/>
                        <YAxis dataKey="name" type="category" tick={{fontSize:10,fill:C.inkSoft}} width={95}/>
                        <Tooltip formatter={v=>fmtBRL(v)} contentStyle={{borderRadius:10,border:`1px solid ${C.border}`,fontSize:12}}/>
                        <Bar dataKey="value" name="Receita" fill={C.green} radius={[0,6,6,0]}/>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                )}

                {despCat.length > 0 && (
                  <div className="rounded-2xl p-4" style={{background:C.card, border:`1px solid ${C.border}`}}>
                    <p className="font-bold text-sm mb-3" style={{color:C.ink}}>Despesas por categoria</p>
                    <div className="flex gap-4 items-center">
                      <ResponsiveContainer width="50%" height={140}>
                        <PieChart>
                          <Pie data={despCat} cx="50%" cy="50%" innerRadius={38} outerRadius={62}
                            dataKey="value" paddingAngle={2}>
                            {despCat.map((_,i) => <Cell key={i} fill={PIE_COLORS[i%PIE_COLORS.length]}/>)}
                          </Pie>
                          <Tooltip formatter={v=>fmtBRL(v)} contentStyle={{borderRadius:10,fontSize:12}}/>
                        </PieChart>
                      </ResponsiveContainer>
                      <div className="flex-1 flex flex-col gap-1.5">
                        {despCat.slice(0,5).map((d,i) => (
                          <div key={i} className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-1.5 min-w-0">
                              <div style={{width:8,height:8,borderRadius:2,background:PIE_COLORS[i%PIE_COLORS.length],flexShrink:0}}/>
                              <span className="text-xs truncate" style={{color:C.inkSoft}}>{d.name}</span>
                            </div>
                            <span className="text-xs font-semibold whitespace-nowrap" style={{color:C.ink}}>{fmtBRLc(d.value)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* COMPROMISSOS */}
            {tab === "compromissos" && (
              <div className="flex flex-col gap-3">
                <div className="flex items-center justify-between">
                  <p className="font-bold text-sm" style={{color:C.ink}}>
                    {compromissos.length} compromisso{compromissos.length!==1?"s":""} em aberto
                  </p>
                  {compromissos.length > 0 && <p className="font-bold text-sm" style={{color:C.red}}>{fmtBRL(totalAP)}</p>}
                </div>

                {compromissos.length === 0 ? (
                  <div className="rounded-2xl p-8 text-center" style={{background:C.card, border:`1px solid ${C.border}`}}>
                    <CheckCircle2 size={32} style={{color:C.green, margin:"0 auto 8px"}}/>
                    <p className="font-semibold text-sm" style={{color:C.ink}}>Nada a pagar!</p>
                    <p className="text-xs mt-1" style={{color:C.inkMute}}>Todas as contas estão em dia.</p>
                  </div>
                ) : compromissos.map(c => {
                  const dias = diasAteVenc(c.vencimento);
                  const urgente = dias !== null && dias >= 0 && dias <= 3;
                  const vencido = c.vencido;
                  const borderColor = vencido ? C.red : urgente ? C.amber : C.border;
                  return (
                    <div key={c.id} className="rounded-2xl p-4" style={{background:C.card, border:`1.5px solid ${borderColor}`}}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-bold text-sm" style={{color:C.ink}}>{c.descricao}</span>
                            <span className="px-2 py-0.5 rounded-md text-xs font-semibold"
                              style={{background:`${C.navy}15`, color:C.navy}}>{c.tipo}</span>
                          </div>
                          <p className="text-xs mt-0.5" style={{color:C.inkSoft}}>{c.categoria}</p>
                          <div className="flex items-center gap-1.5 mt-2">
                            <Calendar size={11} style={{color: vencido?C.red:urgente?C.amber:C.inkMute}}/>
                            <span className="text-xs" style={{color: vencido?C.red:urgente?C.amber:C.inkMute}}>
                              {vencido ? `Vencido em ${fmtDateFull(c.vencimento)}`
                               : dias===0 ? "Vence hoje!"
                               : dias===1 ? "Vence amanhã"
                               : c.vencimento ? `Vence em ${fmtDateFull(c.vencimento)}`
                               : "Sem data"}
                            </span>
                          </div>
                        </div>
                        <span className="font-bold text-base whitespace-nowrap" style={{color:C.ink}}>{fmtBRL(c.valor)}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* RECEITAS */}
            {tab === "receitas" && (
              <div className="flex flex-col gap-4">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <p className="font-bold text-sm" style={{color:C.ink}}>Notas a receber</p>
                    <span className="font-bold text-sm" style={{color:C.amber}}>{fmtBRL(totalAReceber)}</span>
                  </div>
                  {notasAReceber.length === 0 ? (
                    <div className="rounded-2xl p-5 text-center" style={{background:C.card, border:`1px solid ${C.border}`}}>
                      <p className="text-xs" style={{color:C.inkMute}}>Nenhuma nota em aberto.</p>
                    </div>
                  ) : notasAReceber.map(n => {
                    const vencido = isVencido(n.vencimento);
                    return (
                      <div key={n.id} className="rounded-2xl p-4 mb-2"
                        style={{background:C.card, border:`1.5px solid ${vencido?C.amber:C.border}`}}>
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <p className="font-bold text-sm" style={{color:C.ink}}>{n.cliente}</p>
                            {n.numNota && <p className="text-xs mt-0.5" style={{color:C.inkMute}}>NF {n.numNota}</p>}
                            <div className="flex items-center gap-1.5 mt-1.5">
                              <Calendar size={11} style={{color:vencido?C.amber:C.inkMute}}/>
                              <span className="text-xs" style={{color:vencido?C.amber:C.inkMute}}>
                                {vencido ? `Atrasada — ${fmtDateFull(n.vencimento)}` : `Vence ${fmtDateFull(n.vencimento)}`}
                              </span>
                            </div>
                          </div>
                          <span className="font-bold text-base whitespace-nowrap" style={{color:C.green}}>{fmtBRL(n.valor)}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div>
                  <p className="font-bold text-sm mb-2" style={{color:C.ink}}>Serviços lançados em {mesLabel}</p>
                  {lancamentos.filter(l => l.tipo==="Receita" && l.data && l.data.startsWith(mes)).length === 0 ? (
                    <div className="rounded-2xl p-6 text-center" style={{background:C.card, border:`1px solid ${C.border}`}}>
                      <p className="text-xs" style={{color:C.inkMute}}>Nenhum serviço lançado este mês.</p>
                      <a href="index.html" className="text-xs font-semibold block mt-2" style={{color:C.primary}}>Adicionar no Financeiro →</a>
                    </div>
                  ) : lancamentos
                      .filter(l => l.tipo==="Receita" && l.data && l.data.startsWith(mes))
                      .sort((a,b) => b.data < a.data ? -1 : 1)
                      .map(l => (
                        <div key={l.id} className="rounded-xl p-3 mb-2 flex items-center justify-between gap-2"
                          style={{background:C.borderSoft}}>
                          <div className="min-w-0 flex-1">
                            <p className="text-sm font-semibold truncate" style={{color:C.ink}}>{l.descricao}</p>
                            <p className="text-xs mt-0.5" style={{color:C.inkSoft}}>{l.categoria} · {fmtDateFull(l.data)}</p>
                          </div>
                          <span className="font-bold text-sm whitespace-nowrap" style={{color:C.green}}>{fmtBRL(l.valor)}</span>
                        </div>
                      ))
                  }
                </div>
              </div>
            )}

            {/* EVOLUÇÃO */}
            {tab === "evolucao" && (
              <div className="flex flex-col gap-4">
                <div className="rounded-2xl p-4" style={{background:C.card, border:`1px solid ${C.border}`}}>
                  <p className="font-bold text-sm mb-3" style={{color:C.ink}}>Receitas vs Despesas — últimos 6 meses</p>
                  <ResponsiveContainer width="100%" height={200}>
                    <BarChart data={evolucao} margin={{left:-10,right:8,top:0,bottom:0}}>
                      <CartesianGrid strokeDasharray="3 3" stroke={C.border}/>
                      <XAxis dataKey="label" tick={{fontSize:10,fill:C.inkSoft}}/>
                      <YAxis tick={{fontSize:9,fill:C.inkMute}} tickFormatter={v=>fmtBRLc(v)}/>
                      <Tooltip formatter={v=>fmtBRL(v)} contentStyle={{borderRadius:10,border:`1px solid ${C.border}`,fontSize:12}}/>
                      <Legend wrapperStyle={{fontSize:11}}/>
                      <Bar dataKey="rec" name="Receita" fill={C.green} radius={[4,4,0,0]}/>
                      <Bar dataKey="desp" name="Despesa" fill={C.red} radius={[4,4,0,0]}/>
                    </BarChart>
                  </ResponsiveContainer>
                </div>

                <div className="rounded-2xl p-4" style={{background:C.card, border:`1px solid ${C.border}`}}>
                  <p className="font-bold text-sm mb-3" style={{color:C.ink}}>Resultado por mês</p>
                  <div className="flex flex-col gap-2.5">
                    {evolucao.map((m,i) => {
                      const positivo = m.result >= 0;
                      const maxVal = Math.max(...evolucao.map(x => Math.abs(x.result)), 1);
                      const pct = Math.abs(m.result) / maxVal;
                      return (
                        <div key={i} className="flex items-center gap-3">
                          <span className="text-xs w-8 text-right" style={{color:C.inkSoft}}>{m.label}</span>
                          <div className="flex-1 h-6 rounded-lg overflow-hidden" style={{background:C.borderSoft}}>
                            <div style={{
                              width: `${Math.max(pct*100, m.result!==0?8:0)}%`, height:"100%",
                              background: positivo ? C.green : C.red,
                              borderRadius:6,
                              display:"flex", alignItems:"center", paddingLeft:6,
                            }}>
                              {m.result !== 0 && (
                                <span style={{color:"#fff",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>
                                  {fmtBRLc(m.result)}
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {dividas.filter(d=>d.status==="Ativo").length > 0 && (
                  <div className="rounded-2xl p-4" style={{background:C.card, border:`1px solid ${C.border}`}}>
                    <p className="font-bold text-sm mb-3" style={{color:C.ink}}>Dívidas ativas</p>
                    {dividas.filter(d=>d.status==="Ativo").map(d => {
                      const pct = d.parcelaTotal > 0 ? d.parcelaPaga / d.parcelaTotal : 0;
                      return (
                        <div key={d.id} className="mb-4 last:mb-0">
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-sm font-semibold" style={{color:C.ink}}>{d.credor}</span>
                            <span className="text-xs" style={{color:C.inkSoft}}>{fmtBRL(d.saldo)} restante</span>
                          </div>
                          <div className="h-2 rounded-full overflow-hidden" style={{background:C.borderSoft}}>
                            <div style={{width:`${pct*100}%`, height:"100%", background:C.primary, borderRadius:4}}/>
                          </div>
                          <div className="flex justify-between mt-1">
                            <span className="text-xs" style={{color:C.inkMute}}>{d.parcelaPaga}/{d.parcelaTotal} parcelas</span>
                            <span className="text-xs" style={{color:C.inkMute}}>{fmtBRL(d.valorParcela)}/mês</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

          </div>
        </div>
      );
    }

    function KpiCard({ label, value, color, icon: Icon, highlight }) {
      return (
        <div className="rounded-2xl p-4" style={{
          background: highlight ? C.navy : C.card,
          border: `1.5px solid ${highlight ? "transparent" : C.border}`,
        }}>
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold uppercase tracking-wide"
              style={{color: highlight ? "rgba(255,255,255,0.6)" : C.inkSoft}}>{label}</span>
            <div className="p-1.5 rounded-lg" style={{background: highlight ? "rgba(255,255,255,0.1)" : `${color}18`}}>
              <Icon size={13} style={{color: highlight ? "#fff" : color}}/>
            </div>
          </div>
          <p className="font-bold text-lg leading-tight" style={{color: highlight ? "#fff" : C.ink}}>{fmtBRL(value)}</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
