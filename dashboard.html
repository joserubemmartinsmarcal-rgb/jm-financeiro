<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1F4E79" />
  <title>JM Transportes — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: #F6F5F1; overscroll-behavior-y: none; }
    body { color: #1C1F24; font-family: Barlow, "Arial Narrow", Arial, sans-serif; }
    a { color: #1F5FBF; } a:hover { color: #174A95; }
    button { font-family: inherit; }
    .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Paleta do design system "JM Transportes" (artifact Controle de Faturamento)
    const C = {
      bg: "#F6F5F1", card: "#FFFFFF", navy: "#1F4E79", navySoft: "#D6E2EE",
      amber: "#F2B705", tint: "#FFF4CC",
      ink: "#1C1F24", muted: "#5B616B",
      border: "#D9D6CC", borderSoft: "#ECEAE3",
      ok: "#1E7A46", warn: "#B45309", danger: "#B42318",
    };

    const fmtBRL = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    const fmtBRLc = v => { const n=Number(v)||0; return Math.abs(n)>=1000?`R$ ${(n/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})} mil`:fmtBRL(n); };
    const fmtData = iso => { if(!iso) return "—"; const[y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
    const pad = n => String(n).padStart(2,"0");
    const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const todayISO = () => isoLocal(new Date());
    const mesAtual = () => todayISO().slice(0,7);
    const isVencido = d => d && d < todayISO();
    const diasAte = d => {
      if(!d) return null;
      const [y,m,dd] = d.split("-").map(Number);
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      return Math.round((new Date(y,m-1,dd) - hoje) / 86400000);
    };
    const plural = (n, s, p) => `${n} ${n===1?s:p}`;
    const soma = (arr, k="valor") => arr.reduce((s,x) => s + (Number(x[k])||0), 0);

    function readLS(key) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : []; } catch { return []; }
    }

    function prazoInfo(venc) {
      const dias = diasAte(venc);
      if (dias === null) return { txt: "Sem vencimento", cor: C.muted };
      if (dias < 0) return { txt: plural(-dias, "dia de atraso", "dias de atraso"), cor: C.danger };
      if (dias === 0) return { txt: "Vence hoje", cor: C.warn };
      if (dias <= 3) return { txt: `Vence em ${plural(dias, "dia", "dias")}`, cor: C.warn };
      return { txt: `Vence em ${plural(dias, "dia", "dias")}`, cor: C.muted };
    }

    const card = { background: C.card, border: `1px solid ${C.border}`, borderRadius: 8 };
    const h2 = { margin: 0, fontSize: 20, lineHeight: "26px", fontWeight: 600 };

    function App() {
      const [lancamentos, setLancamentos] = useState(() => readLS("jm:lancamentos"));
      const [boletos, setBoletos]         = useState(() => readLS("jm:boletos"));
      const [notas, setNotas]             = useState(() => readLS("jm:notas"));
      const [dividas, setDividas]         = useState(() => readLS("jm:dividas"));
      const [tab, setTab]                 = useState("resumo");

      useEffect(() => {
        const sync = () => {
          setLancamentos(readLS("jm:lancamentos"));
          setBoletos(readLS("jm:boletos"));
          setNotas(readLS("jm:notas"));
          setDividas(readLS("jm:dividas"));
        };
        const onVis = () => { if (document.visibilityState === "visible") sync(); };
        window.addEventListener("focus", sync);
        window.addEventListener("storage", sync);
        document.addEventListener("visibilitychange", onVis);
        return () => {
          window.removeEventListener("focus", sync);
          window.removeEventListener("storage", sync);
          document.removeEventListener("visibilitychange", onVis);
        };
      }, []);

      const mes = mesAtual();
      const mesLabel = new Date().toLocaleDateString("pt-BR",{month:"long", year:"numeric"}).replace(/^./, c => c.toUpperCase());

      const receitasMesL = lancamentos.filter(l => l.tipo==="Receita" && l.data && l.data.startsWith(mes));
      const despesasMesL = lancamentos.filter(l => l.tipo==="Despesa" && l.data && l.data.startsWith(mes));
      const receitasMes = soma(receitasMesL);
      const despesasMes = soma(despesasMesL);
      const resultadoMes = receitasMes - despesasMes;

      const notasPend = notas.filter(n => n.status !== "Recebido");
      const notasVenc = notasPend.filter(n => isVencido(n.vencimento));

      const compromissos = useMemo(() => {
        const b = boletos.filter(b => b.status !== "Pago").map(b => ({
          id: b.id, tipo: "Boleto", descricao: b.fornecedor, categoria: b.categoria,
          valor: Number(b.valor)||0, vencimento: b.vencimento,
        }));
        const d = dividas.filter(d => d.status === "Ativo").map(d => ({
          id: d.id, tipo: "Dívida", descricao: d.credor, categoria: d.tipo || "Financiamento",
          valor: Number(d.valorParcela)||0, vencimento: d.proxVenc,
          parcela: `${d.parcelaPaga||0}/${d.parcelaTotal||0}`,
        }));
        return [...b, ...d].sort((a,b) => (a.vencimento||"9999").localeCompare(b.vencimento||"9999"));
      }, [boletos, dividas]);
      const totalAP = soma(compromissos);
      const vencidosAP = compromissos.filter(c => isVencido(c.vencimento));

      const meses = useMemo(() => {
        const out = [];
        const hoje = new Date();
        for (let i = 5; i >= 0; i--) {
          const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
          const m = isoLocal(d).slice(0,7);
          const rec = soma(lancamentos.filter(l => l.tipo==="Receita" && l.data && l.data.startsWith(m)));
          const desp = soma(lancamentos.filter(l => l.tipo==="Despesa" && l.data && l.data.startsWith(m)));
          out.push({ m, rot: d.toLocaleDateString("pt-BR",{month:"short"}).replace(".",""), rec, desp, atual: i===0 });
        }
        return out;
      }, [lancamentos]);

      const despCat = useMemo(() => {
        const map = {};
        despesasMesL.forEach(l => { const k = l.categoria || "Outros"; map[k] = (map[k]||0) + (Number(l.valor)||0); });
        return Object.entries(map).map(([nome, valor]) => ({ nome, valor })).sort((a,b) => b.valor - a.valor);
      }, [lancamentos, mes]);

      const grupos = useMemo(() => {
        const map = {};
        notasPend.forEach(n => { const c = n.cliente || "Sem cliente"; (map[c] = map[c] || []).push(n); });
        return Object.entries(map).map(([cliente, lista]) => ({
          cliente, total: soma(lista),
          notas: lista.slice().sort((a,b) => (a.vencimento||"9999").localeCompare(b.vencimento||"9999")),
        })).sort((a,b) => b.total - a.total);
      }, [notas]);

      const kpis = [
        { titulo: "Receitas do mês", valor: fmtBRL(receitasMes), sub: plural(receitasMesL.length, "lançamento", "lançamentos"), cor: C.navy },
        { titulo: "A receber", valor: fmtBRL(soma(notasPend)), sub: plural(notasPend.length, "nota pendente", "notas pendentes"), cor: C.warn },
        { titulo: "Vencido", valor: fmtBRL(soma(notasVenc)), sub: plural(notasVenc.length, "nota em atraso", "notas em atraso"), cor: C.danger },
        { titulo: "Resultado do mês", valor: fmtBRL(resultadoMes), sub: `Despesas ${fmtBRL(despesasMes)}`, cor: resultadoMes >= 0 ? C.ok : C.danger },
      ];

      const semDados = !lancamentos.length && !boletos.length && !notas.length && !dividas.length;
      const titulos = { resumo: "Dashboard", receber: "A receber", pagar: "A pagar", evolucao: "Evolução" };

      return (
        <div style={{minHeight:"100vh", display:"flex", flexDirection:"column", background:C.bg}}>
          <header style={{background:C.navy, color:"#fff", paddingTop:"env(safe-area-inset-top)"}}>
            <div style={{maxWidth:560, margin:"0 auto", padding:"16px 16px 14px", display:"flex", justifyContent:"space-between", alignItems:"flex-end", gap:12}}>
              <div style={{display:"flex", flexDirection:"column", gap:2, minWidth:0}}>
                <span style={{fontSize:13, fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", color:C.navySoft}}>JM Transportes e Auto Socorro</span>
                <h1 style={{margin:0, fontSize:28, lineHeight:"34px", fontWeight:700}}>{titulos[tab]}</h1>
                <span style={{fontSize:14, color:C.navySoft}}>{mesLabel}</span>
              </div>
              <a href="index.html" style={{flexShrink:0, minHeight:44, padding:"0 14px", display:"inline-flex", alignItems:"center", gap:6, borderRadius:4, border:"1px solid rgba(255,255,255,0.35)", color:"#fff", textDecoration:"none", fontSize:15, fontWeight:600}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                Financeiro
              </a>
            </div>
            <div style={{height:4, background:C.amber}}></div>
          </header>

          <main style={{flex:"1 1 auto", width:"100%", maxWidth:560, margin:"0 auto", padding:"16px 16px 24px", display:"flex", flexDirection:"column", gap:16}}>

            {semDados && (
              <div style={{...card, padding:"24px 16px", textAlign:"center", display:"flex", flexDirection:"column", gap:8, alignItems:"center"}}>
                <p style={{margin:0, fontSize:17, fontWeight:700}}>Nenhum dado ainda</p>
                <p style={{margin:0, fontSize:15, color:C.muted}}>Lance receitas, boletos e notas no app Financeiro para ver o painel.</p>
                <a href="index.html" style={{marginTop:8, minHeight:44, padding:"0 18px", display:"inline-flex", alignItems:"center", borderRadius:4, background:C.navy, color:"#fff", textDecoration:"none", fontWeight:600}}>Abrir Financeiro</a>
              </div>
            )}

            {/* RESUMO */}
            {tab === "resumo" && !semDados && (
              <section style={{display:"flex", flexDirection:"column", gap:16}}>
                {(notasVenc.length > 0 || vencidosAP.length > 0) && (
                  <div role="status" style={{background:C.tint, border:`1px solid ${C.amber}`, borderRadius:8, padding:"10px 12px", fontSize:15}}>
                    {vencidosAP.length > 0 && <div><strong>{plural(vencidosAP.length, "conta vencida", "contas vencidas")}</strong> a pagar · {fmtBRL(soma(vencidosAP))}</div>}
                    {notasVenc.length > 0 && <div><strong>{plural(notasVenc.length, "nota atrasada", "notas atrasadas")}</strong> a receber · {fmtBRL(soma(notasVenc))}</div>}
                  </div>
                )}

                <div style={{display:"grid", gridTemplateColumns:"repeat(2, minmax(0, 1fr))", gap:12}}>
                  {kpis.map(k => (
                    <div key={k.titulo} style={{...card, padding:14, display:"flex", flexDirection:"column", gap:4}}>
                      <span style={{fontSize:13, lineHeight:"18px", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.04em", color:C.muted}}>{k.titulo}</span>
                      <span className="num" style={{fontSize:22, lineHeight:"28px", fontWeight:700, color:k.cor, overflowWrap:"anywhere"}}>{k.valor}</span>
                      <span style={{fontSize:13, color:C.muted}}>{k.sub}</span>
                    </div>
                  ))}
                </div>

                <button type="button" onClick={() => setTab("pagar")} style={{...card, width:"100%", padding:"14px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:12, cursor:"pointer", textAlign:"left", color:C.ink}}>
                  <span style={{display:"flex", flexDirection:"column", gap:2}}>
                    <span style={{fontSize:13, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.04em", color:C.muted}}>Total a pagar</span>
                    <span className="num" style={{fontSize:22, fontWeight:700}}>{fmtBRL(totalAP)}</span>
                    <span style={{fontSize:13, color:C.muted}}>{plural(compromissos.length, "compromisso em aberto", "compromissos em aberto")}</span>
                  </span>
                  <span style={{minHeight:44, padding:"0 14px", display:"inline-flex", alignItems:"center", borderRadius:4, border:`1px solid ${C.navy}`, color:C.navy, fontSize:15, fontWeight:600}}>Ver</span>
                </button>

                <FaturamentoMensal meses={meses} />

                {despCat.length > 0 && (
                  <div style={{...card, padding:16, display:"flex", flexDirection:"column", gap:12}}>
                    <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8}}>
                      <h2 style={h2}>Despesas por categoria</h2>
                      <span style={{fontSize:13, color:C.muted}}>mês atual</span>
                    </div>
                    {despCat.slice(0,6).map(d => (
                      <div key={d.nome} style={{display:"flex", flexDirection:"column", gap:4}}>
                        <div style={{display:"flex", justifyContent:"space-between", gap:8, fontSize:14}}>
                          <span style={{minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{d.nome}</span>
                          <span className="num" style={{fontWeight:600, whiteSpace:"nowrap"}}>{fmtBRL(d.valor)}</span>
                        </div>
                        <div style={{height:8, background:C.borderSoft, borderRadius:4, overflow:"hidden"}}>
                          <div style={{width:`${Math.max(2, d.valor / despCat[0].valor * 100)}%`, height:"100%", background:C.navy}}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </section>
            )}

            {/* A RECEBER */}
            {tab === "receber" && (
              <section style={{display:"flex", flexDirection:"column", gap:12}}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8}}>
                  <span style={{fontSize:15, color:C.muted}}>{plural(notasPend.length, "nota", "notas")} · {plural(grupos.length, "cliente", "clientes")}</span>
                  <span className="num" style={{fontSize:20, fontWeight:700}}>{fmtBRL(soma(notasPend))}</span>
                </div>
                {grupos.length === 0 && (
                  <div style={{...card, padding:"24px 16px", textAlign:"center", fontSize:15, color:C.muted}}>Nenhuma nota pendente.</div>
                )}
                {grupos.map(g => (
                  <div key={g.cliente} style={{...card, overflow:"hidden"}}>
                    <div style={{background:C.navy, color:"#fff", padding:"10px 14px", display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8}}>
                      <div style={{display:"flex", flexDirection:"column", minWidth:0}}>
                        <span style={{fontSize:17, fontWeight:700}}>{g.cliente}</span>
                        <span style={{fontSize:13, color:C.navySoft}}>{plural(g.notas.length, "nota pendente", "notas pendentes")}</span>
                      </div>
                      <span className="num" style={{fontSize:18, fontWeight:700, whiteSpace:"nowrap"}}>{fmtBRL(g.total)}</span>
                    </div>
                    {g.notas.map(n => {
                      const p = prazoInfo(n.vencimento);
                      return (
                        <div key={n.id} style={{padding:"12px 14px", borderTop:`1px solid ${C.borderSoft}`, display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8}}>
                          <div style={{display:"flex", flexDirection:"column", gap:2, minWidth:0}}>
                            <span className="mono" style={{fontSize:13, color:C.muted}}>{n.numNota ? `NF ${n.numNota}` : "Sem número"}</span>
                            <span style={{fontSize:14, color:C.muted}}>Vencimento {fmtData(n.vencimento)}</span>
                          </div>
                          <div style={{display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4, flexShrink:0}}>
                            <span className="num" style={{fontSize:17, fontWeight:700}}>{fmtBRL(n.valor)}</span>
                            <span style={{fontSize:14, fontWeight:600, color:p.cor}}>{p.txt}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ))}
                {grupos.length > 0 && (
                  <a href="index.html" style={{fontSize:15, fontWeight:600, textAlign:"center", padding:"8px 0"}}>Dar baixa no app Financeiro</a>
                )}
              </section>
            )}

            {/* A PAGAR */}
            {tab === "pagar" && (
              <section style={{display:"flex", flexDirection:"column", gap:12}}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8}}>
                  <span style={{fontSize:15, color:C.muted}}>{plural(compromissos.length, "compromisso em aberto", "compromissos em aberto")}</span>
                  <span className="num" style={{fontSize:20, fontWeight:700}}>{fmtBRL(totalAP)}</span>
                </div>
                {compromissos.length === 0 ? (
                  <div style={{...card, padding:"24px 16px", textAlign:"center", fontSize:15, color:C.muted}}>Nada a pagar. Todas as contas estão em dia.</div>
                ) : (
                  <div style={{...card, overflow:"hidden"}}>
                    {compromissos.map((c, i) => {
                      const p = prazoInfo(c.vencimento);
                      const venc = isVencido(c.vencimento);
                      return (
                        <div key={c.id} style={{padding:"12px 14px", borderTop: i ? `1px solid ${C.borderSoft}` : "none", background: venc ? "#FDF0EE" : C.card, display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8}}>
                          <div style={{display:"flex", flexDirection:"column", gap:2, minWidth:0}}>
                            <span style={{fontSize:15, fontWeight:600}}>{c.descricao}</span>
                            <span style={{fontSize:13, color:C.muted}}>
                              {c.tipo}{c.categoria ? ` · ${c.categoria}` : ""}{c.parcela ? ` · parcela ${c.parcela}` : ""}
                            </span>
                            <span style={{fontSize:14, color:C.muted}}>Vencimento {fmtData(c.vencimento)}</span>
                          </div>
                          <div style={{display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4, flexShrink:0}}>
                            <span className="num" style={{fontSize:17, fontWeight:700}}>{fmtBRL(c.valor)}</span>
                            <span style={{fontSize:14, fontWeight:600, color:p.cor}}>{p.txt}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            )}

            {/* EVOLUÇÃO */}
            {tab === "evolucao" && (
              <section style={{display:"flex", flexDirection:"column", gap:16}}>
                <FaturamentoMensal meses={meses} />

                <div style={{...card, overflow:"hidden"}}>
                  <div style={{padding:"14px 16px 10px"}}><h2 style={h2}>Resultado por mês</h2></div>
                  <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8, padding:"8px 16px", background:"#23272E", color:"#fff", fontSize:13, fontWeight:600, letterSpacing:"0.02em", textTransform:"uppercase"}}>
                    <span>Mês</span><span style={{textAlign:"right"}}>Receita</span><span style={{textAlign:"right"}}>Despesa</span><span style={{textAlign:"right"}}>Saldo</span>
                  </div>
                  {meses.map(m => {
                    const r = m.rec - m.desp;
                    return (
                      <div key={m.m} className="num" style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8, padding:"10px 16px", borderTop:`1px solid ${C.borderSoft}`, fontSize:14, background: m.atual ? C.tint : C.card}}>
                        <span style={{fontWeight:600, textTransform:"capitalize"}}>{m.rot}</span>
                        <span style={{textAlign:"right"}}>{fmtBRLc(m.rec)}</span>
                        <span style={{textAlign:"right"}}>{fmtBRLc(m.desp)}</span>
                        <span style={{textAlign:"right", fontWeight:700, color: r >= 0 ? C.ok : C.danger}}>{fmtBRLc(r)}</span>
                      </div>
                    );
                  })}
                </div>

                {dividas.filter(d => d.status === "Ativo").length > 0 && (
                  <div style={{...card, padding:16, display:"flex", flexDirection:"column", gap:14}}>
                    <h2 style={h2}>Dívidas ativas</h2>
                    {dividas.filter(d => d.status === "Ativo").map(d => {
                      const pct = d.parcelaTotal > 0 ? Math.min(1, d.parcelaPaga / d.parcelaTotal) : 0;
                      return (
                        <div key={d.id} style={{display:"flex", flexDirection:"column", gap:4}}>
                          <div style={{display:"flex", justifyContent:"space-between", gap:8}}>
                            <span style={{fontSize:15, fontWeight:600}}>{d.credor}</span>
                            <span className="num" style={{fontSize:14, color:C.muted}}>{fmtBRL(d.saldo)} restante</span>
                          </div>
                          <div style={{height:8, background:C.borderSoft, borderRadius:4, overflow:"hidden"}}>
                            <div style={{width:`${pct*100}%`, height:"100%", background:C.navy}}></div>
                          </div>
                          <div style={{display:"flex", justifyContent:"space-between", fontSize:13, color:C.muted}}>
                            <span>{d.parcelaPaga||0}/{d.parcelaTotal||0} parcelas</span>
                            <span className="num">{fmtBRL(d.valorParcela)}/mês</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            )}
          </main>

          <nav aria-label="Telas" style={{position:"sticky", bottom:0, background:"#fff", borderTop:`1px solid ${C.border}`, paddingBottom:"env(safe-area-inset-bottom)"}}>
            <div style={{maxWidth:560, margin:"0 auto", display:"grid", gridTemplateColumns:"repeat(4, minmax(0, 1fr))"}}>
              {NAV.map(n => {
                const ativo = tab === n.k;
                return (
                  <button key={n.k} type="button" onClick={() => setTab(n.k)} aria-current={ativo ? "page" : undefined}
                    style={{minHeight:60, border:0, borderTop:`3px solid ${ativo ? C.amber : "transparent"}`, background:"#fff", color: ativo ? C.navy : C.muted, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2, fontSize:13, fontWeight:600, cursor:"pointer"}}>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{n.icon}</svg>
                    {n.l}
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    const NAV = [
      { k: "resumo", l: "Resumo", icon: <><path d="M3 3v18h18"/><path d="M8 16v-5"/><path d="M13 16V7"/><path d="M18 16v-3"/></> },
      { k: "receber", l: "A receber", icon: <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></> },
      { k: "pagar", l: "A pagar", icon: <><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></> },
      { k: "evolucao", l: "Evolução", icon: <><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></> },
    ];

    function FaturamentoMensal({ meses }) {
      const max = Math.max(1, ...meses.map(m => m.rec));
      return (
        <div style={{...card, padding:16, display:"flex", flexDirection:"column", gap:12}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8}}>
            <h2 style={h2}>Faturamento por mês</h2>
            <span style={{fontSize:13, color:C.muted}}>receitas, 6 meses</span>
          </div>
          <div role="img" aria-label={"Receitas por mês: " + meses.map(m => `${m.rot} ${fmtBRL(m.rec)}`).join(", ")}
            style={{display:"grid", gridTemplateColumns:"repeat(6, minmax(0, 1fr))", gap:8, alignItems:"end", height:190, borderBottom:`1px solid ${C.border}`}}>
            {meses.map(m => (
              <div key={m.m} style={{display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"flex-end", gap:4, height:"100%"}}>
                <span style={{fontSize:11, fontWeight:600, color:C.muted, textAlign:"center", whiteSpace:"nowrap"}}>{m.rec ? fmtBRLc(m.rec) : "—"}</span>
                <div title={fmtBRL(m.rec)} style={{width:"100%", maxWidth:44, height: m.rec ? Math.max(4, Math.round(m.rec / max * 150)) : 0, background: m.atual ? C.amber : C.navy, borderRadius:"4px 4px 0 0"}}></div>
              </div>
            ))}
          </div>
          <div style={{display:"grid", gridTemplateColumns:"repeat(6, minmax(0, 1fr))", gap:8}}>
            {meses.map(m => (
              <span key={m.m} style={{fontSize:13, fontWeight:600, textAlign:"center", color:C.muted, textTransform:"capitalize"}}>{m.rot}</span>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
